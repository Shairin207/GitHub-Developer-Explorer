
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Developer Explorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">Github Explorer</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="indexeddb.html">Database</a>
            <a href="https://github.com">Github</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Discover Github Developers</h1>
        <p>Explore developer profiles from Github API</p>

        <button onclick="document.getElementById('developers').scrollIntoView()">
            Explore Developers
        </button>
    </section>

    <!-- Developers -->
    <section class="developers-section">
        <h2>Highlighted Github Developers</h2>
        <div id="developers">Loading developers...</div>
    </section>

    <!-- Search -->
    <section class="search-box">
        <h2>Search Github Developer</h2>
        <p>Find any Github user by username</p>

        <input id="username" placeholder="Enter Github username">
        <button onclick="searchUser()">Search</button>
    </section>

    <!-- Footer -->
    <footer>
        <p>Github Developer Explorer</p>
    </footer>

    <script src="js/github-api.js"></script>

</body>
</html>
