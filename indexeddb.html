
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Database</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="database-page">

    <h1>IndexedDB Developer Storage</h1>

    <div class="database-container">
        <input id="developerID" placeholder="Developer ID">
        <input id="homepage" placeholder="Homepage URL">
        <input id="location" placeholder="Location">

        <div class="database-buttons">
            <button onclick="addDeveloper()">Save Developer</button>
            <button onclick="deleteLast()">Delete Last</button>
            <button onclick="deleteAll()">Delete All</button>
        </div>
    </div>

    <h2 id="savedTitle" style="display:none">Saved Developers</h2>
    <div id="developerList"></div>

    <script src="js/indexeddb.js"></script>

</body>
</html>
